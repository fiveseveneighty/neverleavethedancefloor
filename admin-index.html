<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NLTDF Admin</title>
<link rel="icon" type="image/png" sizes="32x32" href="/admin-favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/admin-favicon-16x16.png">
<link rel="shortcut icon" href="/admin-favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/admin-apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #060408;
    font-family: 'Josefin Sans', sans-serif;
    color: #ece7ef;
    min-height: 100vh;
    padding: 24px 16px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 24px; letter-spacing: 0.02em; }

  .card {
    border: 1px solid rgba(255,255,255,0.09);
    background: rgba(255,255,255,0.02);
    padding: 20px;
    margin-bottom: 20px;
  }
  label { display: block; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #8d8794; margin-bottom: 6px; }
  input[type="password"] {
    width: 100%;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.15);
    color: #eee;
    font-family: 'Josefin Sans', sans-serif;
    font-size: 14px;
    padding: 10px 12px;
    margin-bottom: 14px;
  }
  button {
    font-family: 'Josefin Sans', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 8px 14px;
    border: 1px solid;
    background: transparent;
    cursor: pointer;
  }
  #unlock-btn { color: #e8789c; border-color: rgba(232,120,156,0.35); background: rgba(232,120,156,0.08); padding: 10px 18px; width: 100%; }
  #unlock-btn:hover { background: rgba(232,120,156,0.15); }

  .status { font-size: 12px; margin-top: 10px; }
  .status.err { color: #eb5757; }

  #gate { text-align: center; padding: 60px 0; }
  #gate .card { max-width: 320px; margin: 0 auto; }
  #main { display: none; }

  .tiles { display: flex; flex-direction: column; gap: 14px; }
  .tile {
    display: block;
    border: 1px solid rgba(255,255,255,0.09);
    background: rgba(255,255,255,0.02);
    padding: 20px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s, background 0.15s;
  }
  .tile:hover { border-color: rgba(232,120,156,0.45); background: rgba(232,120,156,0.06); }
  .tile-name { font-size: 16px; font-weight: 600; color: #fff; margin-bottom: 4px; }
  .tile-desc { font-size: 13px; color: #8d8794; line-height: 1.5; }

  .forget { display: block; text-align: center; margin-top: 22px; font-size: 11px; color: #625d68; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
  .forget:hover { color: #8d8794; }
</style>
</head>
<body>
<div class="wrap">
  <h1>NLTDF Admin</h1>

  <div id="gate" class="card">
    <label for="pw">Password</label>
    <input type="password" id="pw" autocomplete="current-password">
    <button id="unlock-btn">Unlock</button>
    <div id="gate-status" class="status"></div>
  </div>

  <div id="main">
    <div class="tiles">
      <a class="tile" href="/library">
        <div class="tile-name">Library</div>
        <div class="tile-desc">Browse and play your Spotify library.</div>
      </a>
      <a class="tile" href="/admin.html">
        <div class="tile-name">Apple Music Links</div>
        <div class="tile-desc">Attach Apple Music URLs to weekly mixes.</div>
      </a>
      <a class="tile" href="/admin-events.html">
        <div class="tile-name">Event Intake</div>
        <div class="tile-desc">Review and approve new show candidates for the calendar.</div>
      </a>
    </div>
    <a id="forget-link" class="forget">Forget password on this device</a>
  </div>
</div>

<script>
  const PW_STORAGE_KEY = 'nltdf_admin_pw';
  let password = '';

  function showMain() {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('main').style.display = 'block';
  }

  async function verify(pw) {
    const res = await fetch('/api/admin-events?password=' + encodeURIComponent(pw));
    if (res.status === 401) throw new Error('UNAUTHORIZED');
    if (!res.ok) throw new Error('SERVER_ERROR');
  }

  async function tryStoredPassword() {
    let stored;
    try { stored = sessionStorage.getItem(PW_STORAGE_KEY); } catch(e) {}
    if (!stored) return;
    try {
      await verify(stored);
      password = stored;
      showMain();
    } catch (e) {
      try { sessionStorage.removeItem(PW_STORAGE_KEY); } catch(e2) {}
    }
  }

  document.getElementById('unlock-btn').addEventListener('click', async () => {
    const pw = document.getElementById('pw').value.trim();
    const statusEl = document.getElementById('gate-status');
    if (!pw) return;
    statusEl.textContent = 'Checking...';
    statusEl.className = 'status';
    try {
      await verify(pw);
      password = pw;
      try { sessionStorage.setItem(PW_STORAGE_KEY, pw); } catch(e) {}
      showMain();
    } catch (err) {
      statusEl.textContent = err.message === 'UNAUTHORIZED'
        ? 'Incorrect password — try again.'
        : 'Could not connect to server. Try again.';
      statusEl.className = 'status err';
    }
  });

  document.getElementById('pw').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('unlock-btn').click();
  });

  document.getElementById('forget-link').addEventListener('click', () => {
    try { sessionStorage.removeItem(PW_STORAGE_KEY); } catch(e) {}
    location.reload();
  });

  tryStoredPassword();
</script>
</body>
</html>
