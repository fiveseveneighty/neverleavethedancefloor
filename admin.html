<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NLTDF Admin — Apple Music Links</title>
<link rel="icon" type="image/png" sizes="32x32" href="/admin-favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/admin-favicon-16x16.png">
<link rel="shortcut icon" href="/admin-favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/admin-apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #060408;
    font-family: 'Josefin Sans', sans-serif;
    color: #d0d0d0;
    min-height: 100vh;
    padding: 24px 16px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 24px; letter-spacing: 0.02em; }

  .card {
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.02);
    padding: 20px;
    margin-bottom: 20px;
  }

  label { display: block; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #888; margin-bottom: 6px; }
  input[type="password"], input[type="text"], input[type="url"], select {
    width: 100%;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.15);
    color: #eee;
    font-family: 'Josefin Sans', sans-serif;
    font-size: 14px;
    padding: 10px 12px;
    margin-bottom: 14px;
  }
  select option { background: #111; }

  button {
    font-family: 'Josefin Sans', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #e8789c;
    border: 1px solid rgba(232,120,156,0.35);
    background: rgba(232,120,156,0.08);
    padding: 10px 18px;
    cursor: pointer;
  }
  button:hover { background: rgba(232,120,156,0.15); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button + button { margin-left: 8px; }

  input[type="checkbox"] { width: auto; margin: 0; accent-color: #e8789c; cursor: pointer; }
  .checkbox-row {
    display: flex; align-items: center; gap: 8px;
    margin-top: 14px;
  }
  .checkbox-row label {
    display: inline; font-size: 12px; letter-spacing: normal;
    text-transform: none; color: #aaa; margin-bottom: 0; cursor: pointer;
  }

  button.secondary {
    color: #999;
    border-color: rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.03);
  }
  button.secondary:hover { background: rgba(255,255,255,0.08); }
  #refresh-btn { margin-top: 10px; }

  .status { font-size: 12px; margin-top: 10px; min-height: 15px; }
  .status.ok { color: #6fcf97; }
  .status.err { color: #eb5757; }
  .status.warn { color: #f2c94c; }

  .mix-list { max-height: 340px; overflow-y: auto; }
  .mix-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
    font-size: 13px;
  }
  .mix-row:last-child { border-bottom: none; }
  .mix-name { color: #ddd; }
  .mix-badge { font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 8px; border: 1px solid; }
  .mix-badge.yes { color: #6fcf97; border-color: rgba(111,207,151,0.4); }
  .mix-badge.no { color: #666; border-color: rgba(255,255,255,0.15); }

  #gate { text-align: center; padding: 60px 0; }
  #main { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>NLTDF Admin — Apple Music Links</h1>

  <div id="gate" class="card">
    <label for="pw">Password</label>
    <input type="password" id="pw" autocomplete="current-password">
    <button id="unlock-btn">Unlock</button>
    <div id="gate-status" class="status"></div>
  </div>

  <div id="main">
    <div class="card">
      <label for="mix-select">Select mix</label>
      <select id="mix-select"></select>

      <label for="apple-url">Apple Music URL</label>
      <input type="url" id="apple-url" placeholder="https://music.apple.com/us/playlist/...">

      <button id="save-btn">Save mapping</button>

      <div class="checkbox-row">
        <input type="checkbox" id="auto-refresh-cb" checked>
        <label for="auto-refresh-cb">Auto-refresh live site after each save</label>
      </div>

      <button id="refresh-btn" class="secondary" style="display:none;">Refresh live site</button>

      <div id="save-status" class="status"></div>
    </div>

    <div class="card">
      <label>Current mixes</label>
      <div id="mix-list" class="mix-list"></div>
    </div>
  </div>
</div>

<script>
  let password = '';
  let mixes = [];

  // --- status helper: shows a message, optionally auto-dismisses it.
  // Tokened so an earlier message's dismiss timer can't clear a later,
  // still-current message (e.g. "Saving..." -> "Saved" firing back to
  // back).
  let statusToken = 0;
  function setStatus(el, text, cls, autoDismissMs) {
    const token = ++statusToken;
    el.textContent = text;
    el.className = 'status' + (cls ? ' ' + cls : '');
    if (autoDismissMs) {
      setTimeout(() => {
        if (statusToken === token) {
          el.textContent = '';
          el.className = 'status';
        }
      }, autoDismissMs);
    }
  }

  // Turns a { triggered, ok, data, error } refresh result (see
  // functions/api/admin-apple-music.js) into a short status phrase + class.
  function describeRefresh(refresh) {
    if (!refresh) return { text: '', cls: '' };
    if (!refresh.triggered) {
      return { text: 'live refresh failed to start', cls: 'err' };
    }
    if (refresh.data && refresh.data.skipped) {
      return { text: 'live refresh skipped — Spotify rate-limited, will catch up on next hourly run', cls: 'warn' };
    }
    if (refresh.ok && refresh.data && refresh.data.success !== false) {
      return { text: 'live site refreshed ✓', cls: 'ok' };
    }
    return { text: 'live refresh failed', cls: 'err' };
  }

  const AUTO_REFRESH_KEY = 'nltdf_admin_auto_refresh';
  const autoRefreshCb = document.getElementById('auto-refresh-cb');
  const refreshBtn = document.getElementById('refresh-btn');

  function updateRefreshBtnVisibility() {
    // Hidden while auto-refresh is on — it's already handled on save, so
    // showing it then would look like a required extra step. Only appears
    // once auto-refresh is turned off (e.g. batching several saves before
    // pushing one refresh at the end).
    refreshBtn.style.display = autoRefreshCb.checked ? 'none' : 'inline-block';
  }

  try {
    const stored = localStorage.getItem(AUTO_REFRESH_KEY);
    if (stored !== null) autoRefreshCb.checked = stored === '1';
  } catch (err) {
    // Private browsing / blocked storage — default (checked) stands.
  }
  updateRefreshBtnVisibility();
  autoRefreshCb.addEventListener('change', () => {
    try {
      localStorage.setItem(AUTO_REFRESH_KEY, autoRefreshCb.checked ? '1' : '0');
    } catch (err) {
      // Not persisted this time — no functional impact, just won't stick
      // across reloads.
    }
    updateRefreshBtnVisibility();
  });

  async function fetchMixes() {
    const res = await fetch('/api/admin-apple-music?password=' + encodeURIComponent(password));
    if (!res.ok) throw new Error('AUTH_FAILED');
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    return data.mixes || [];
  }

  function renderMixSelect() {
    const select = document.getElementById('mix-select');
    select.innerHTML = mixes.map(m =>
      `<option value="${escapeHtml(m.name)}">${escapeHtml(m.name)}${m.hasMapping ? ' (mapped)' : ''}</option>`
    ).join('');
  }

  function renderMixList() {
    const container = document.getElementById('mix-list');
    container.innerHTML = mixes.map(m => `
      <div class="mix-row">
        <span class="mix-name">${escapeHtml(m.name)}</span>
        <span class="mix-badge ${m.hasMapping ? 'yes' : 'no'}">${m.hasMapping ? 'Mapped' : 'No link'}</span>
      </div>`
    ).join('');
  }

  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  document.getElementById('unlock-btn').addEventListener('click', async () => {
    password = document.getElementById('pw').value;
    const statusEl = document.getElementById('gate-status');
    statusEl.textContent = 'Checking...';
    statusEl.className = 'status';
    try {
      mixes = await fetchMixes();
      document.getElementById('gate').style.display = 'none';
      document.getElementById('main').style.display = 'block';
      renderMixSelect();
      renderMixList();
    } catch (err) {
      statusEl.textContent = 'Incorrect password or server error.';
      statusEl.className = 'status err';
    }
  });

  document.getElementById('save-btn').addEventListener('click', async () => {
    const mixName = document.getElementById('mix-select').value;
    const appleMusicUrl = document.getElementById('apple-url').value.trim();
    const statusEl = document.getElementById('save-status');
    const btn = document.getElementById('save-btn');
    const autoRefresh = autoRefreshCb.checked;

    if (!mixName || !appleMusicUrl) {
      setStatus(statusEl, 'Select a mix and enter a URL.', 'err', 4000);
      return;
    }

    btn.disabled = true;
    setStatus(statusEl, 'Saving...', '', null);

    try {
      const res = await fetch('/api/admin-apple-music', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password, mixName, appleMusicUrl, autoRefresh }),
      });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || 'SAVE_FAILED');

      document.getElementById('apple-url').value = '';

      // Refresh the list so the badge/select update immediately.
      mixes = await fetchMixes();
      renderMixSelect();
      renderMixList();

      let text = `Saved: ${mixName} → Apple Music`;
      let cls = 'ok';
      if (autoRefresh) {
        const r = describeRefresh(data.refresh);
        if (r.text) {
          text += ' · ' + r.text;
          // A rate-limit skip isn't a failure of the save — keep it 'warn',
          // not 'err', so it doesn't read as something going wrong.
          if (r.cls) cls = r.cls;
        }
      }
      setStatus(statusEl, text, cls, 4500);
    } catch (err) {
      setStatus(statusEl, 'Save failed: ' + err.message, 'err', 5000);
    } finally {
      btn.disabled = false;
    }
  });

  document.getElementById('refresh-btn').addEventListener('click', async () => {
    const statusEl = document.getElementById('save-status');
    const btn = document.getElementById('refresh-btn');

    btn.disabled = true;
    setStatus(statusEl, 'Refreshing live site...', '', null);

    try {
      const res = await fetch('/api/admin-apple-music', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password, action: 'refresh' }),
      });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || 'REFRESH_FAILED');

      const r = describeRefresh(data.refresh);
      setStatus(statusEl, r.text || 'Refresh sent.', r.cls || 'ok', 4500);
    } catch (err) {
      setStatus(statusEl, 'Refresh failed: ' + err.message, 'err', 5000);
    } finally {
      btn.disabled = false;
    }
  });

  // Allow Enter key to submit the password field.
  document.getElementById('pw').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('unlock-btn').click();
  });
</script>
</body>
</html>
