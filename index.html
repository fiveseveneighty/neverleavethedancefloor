<!DOCTYPE html>
<!-- saved from url=(0054)file:///Users/dansaltzman/Downloads/nltdf-city-bg.html -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Never Leave the Dancefloor</title>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #060408;
    font-family: 'Josefin Sans', sans-serif;
    color: #d0d0d0;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* BG: 1672x941 proper 16:9 — 100% width preserves pillars at edges */
  .bg {
    position: fixed; inset: 0;
    background-image: url('NLTDF-BG.png');
    background-size: 100% auto;
    background-position: center top;
    background-repeat: no-repeat;
    opacity: 0.7;
    z-index: 0;
  }

  /* Fade: darken top for logo legibility, gentle vignette on sides, heavy at bottom */
  .bg-fade {
    position: fixed; inset: 0;
    background:
      linear-gradient(to bottom,
        rgba(6,4,8,0.75) 0%,
        rgba(6,4,8,0.1) 18%,
        rgba(6,4,8,0.0) 45%,
        rgba(6,4,8,0.25) 70%,
        rgba(6,4,8,0.9) 100%),
      linear-gradient(to right,
        rgba(6,4,8,0.25) 0%, rgba(6,4,8,0) 10%,
        rgba(6,4,8,0) 90%, rgba(6,4,8,0.25) 100%);
    z-index: 1;
  }

  .inner {
    position: relative; z-index: 2;
    max-width: 1200px; margin: 0 auto;
    padding: 0 36px 60px;
  }

  /* HEADER */
  header {
    text-align: center;
    padding: 48px 0 36px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    margin-bottom: 36px;
  }
  .logo {
    max-width: 380px; height: auto; display: block; margin: 0 auto;
    filter: drop-shadow(0 0 32px rgba(232,120,156,0.65));
  }

  /* GRID */
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr; gap: 16px; align-items: start; }
  .left { grid-column: 1 / 4; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .right { grid-column: 4 / 6; min-width: 0; }

  .card {
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(6,4,8,0.42);
    backdrop-filter: blur(8px);
    padding: 22px;
  }
  .label { font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: #e8789c; padding-bottom: 14px; border-bottom: 1px solid rgba(232,120,156,0.18); margin-bottom: 18px; }

  .mix-row { display: flex; align-items: center; gap: 14px; padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .mix-row:last-child { border-bottom: none; }
  .mix-thumb { width: 38px; height: 38px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #444; font-size: 14px; }
  .mix-info { flex: 1; min-width: 0; }
  .mix-title { font-size: 13px; font-weight: 600; color: #ddd; letter-spacing: 0.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mix-meta { font-size: 9px; color: #555; margin-top: 3px; letter-spacing: 0.05em; }
  .mix-btns { display: flex; gap: 6px; flex-shrink: 0; }
  .mix-btn { font-family: 'Josefin Sans', sans-serif; font-size: 8px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; padding: 5px 10px; border: 1px solid; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
  .btn-sp { color: #1db954; border-color: rgba(29,185,84,0.35); background: rgba(29,185,84,0.07); }
  .btn-am { color: #fc3c44; border-color: rgba(252,60,68,0.35); background: rgba(252,60,68,0.07); }

  .set-row { display: grid; grid-template-columns: 24px 1fr 56px; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); gap: 12px; }
  .set-row:last-child { border-bottom: none; }
  .set-num { font-size: 9px; color: #333; font-weight: 600; }
  .set-title { font-size: 12px; color: #bbb; }
  .set-dur { font-size: 9px; color: #444; text-align: right; }

  .cal-row { padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .cal-row:last-child { border-bottom: none; }
  .cal-top { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px; }
  .cal-next { font-size: 7px; letter-spacing: 0.15em; text-transform: uppercase; color: #e8789c; border: 1px solid rgba(232,120,156,0.3); padding: 1px 5px; margin-bottom: 6px; display: inline-block; }
  .cal-date { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: #444; margin-bottom: 4px; }
  .cal-row.next .cal-date { color: #e8789c; }
  .cal-name { font-size: 15px; font-weight: 600; color: #ccc; letter-spacing: 0.03em; line-height: 1.2; }
  .cal-row.next .cal-name { color: #fff; }
  .cal-venue { font-size: 10px; color: #444; margin-top: 4px; }
  .cal-detail { font-size: 10px; color: #333; margin-top: 3px; }
  .cal-tickets { font-family: 'Josefin Sans', sans-serif; font-size: 8px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; color: #e8789c; border: 1px solid rgba(232,120,156,0.3); background: rgba(232,120,156,0.06); padding: 5px 10px; text-decoration: none; flex-shrink: 0; white-space: nowrap; align-self: flex-start; }
  .cal-tba { font-size: 8px; letter-spacing: 0.1em; text-transform: uppercase; color: #333; white-space: nowrap; align-self: flex-start; padding-top: 3px; }

  footer { margin-top: 36px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.05); text-align: center; font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: #222; }

  /* RESPONSIVE: tablet and below — stack the two-column grid */
  @media (max-width: 860px) {
    .inner { padding: 0 20px 48px; }
    .grid { grid-template-columns: 1fr; gap: 20px; }
    .left, .right { grid-column: 1 / -1; }
    header { padding: 36px 0 28px; }
    .logo { max-width: 280px; }
  }

  /* RESPONSIVE: phone — tighten spacing, enlarge tap targets */
  @media (max-width: 480px) {
    .inner { padding: 0 14px 40px; }
    .card { padding: 16px; }
    .logo { max-width: 220px; }
    header { padding: 28px 0 22px; margin-bottom: 24px; }
    .mix-row, .set-row { gap: 10px; }
    .mix-btn { padding: 8px 12px; font-size: 9px; }
    .cal-tickets { padding: 8px 12px; font-size: 9px; }
    .cal-name { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="bg"></div>
<div class="bg-fade"></div>
<div class="inner">

  <header>
    <img class="logo" src="NLTDF-LOGO.png" alt="Never Leave the Dancefloor">
  </header>

  <div class="grid">
    <div class="left">
      <div class="card">
        <div class="label">Weekly mixes</div>
        <div id="mix-list"></div>
      </div>
      <div class="card">
        <div class="label">Sets</div>
        <div id="sets-list"></div>
      </div>
    </div>
    <div class="card right">
      <div class="label">Upcoming shows</div>
      <div id="cal-list"></div>
    </div>
  </div>

  <footer>Denver · Est. 2025</footer>
</div>


<script>
  // ─── NLTDF Mixes (served via Cloudflare Pages Function) ────────────────
  // The function at functions/api/mixes.js handles Spotify auth and
  // playlist fetching server-side (owned + public playlists only — no
  // date filtering, since playlist cleanup means every public playlist
  // is a legitimate mix). No visitor OAuth, no client-side Spotify calls.
  const MIXES_ENDPOINT = '/api/mixes';
  const MAX_MIXES      = 4;
  // ────────────────────────────────────────────────────────────────────────

  function fmtDuration(ms) {
    const totalMin = Math.round(ms / 60000);
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    return h > 0 ? `${h}h ${m}m` : `${m} min`;
  }

  function monthLabel(dateStr) {
    if (!dateStr) return 'Unknown';
    return new Date(dateStr).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  }

  function renderMixRow(name, meta, img, url) {
    const thumb = img
      ? `<img src="${img}" alt="" style="width:38px;height:38px;object-fit:cover;">`
      : `<div style="width:38px;height:38px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:center;color:#444;font-size:14px;">♫</div>`;
    return `
      <div class="mix-row">
        <div class="mix-thumb">${thumb}</div>
        <div class="mix-info">
          <div class="mix-title">${name}</div>
          <div class="mix-meta">${meta}</div>
        </div>
        <div class="mix-btns">
          <a class="mix-btn btn-sp" href="${url}" target="_blank" rel="noopener">▶ Spotify</a>
        </div>
      </div>`;
  }

  function skeletonRow() {
    return `
      <div class="mix-row" style="opacity:0.25;">
        <div class="mix-thumb">♫</div>
        <div class="mix-info">
          <div style="background:rgba(255,255,255,0.1);height:13px;width:140px;border-radius:2px;"></div>
          <div style="background:rgba(255,255,255,0.05);height:9px;width:100px;border-radius:2px;margin-top:6px;"></div>
        </div>
      </div>`;
  }

  function renderMixList(mixes, showAll) {
    // Group by month, using each mix's newest track date (already computed
    // server-side). Order is preserved from the API response (newest first).
    const visible = showAll ? mixes : mixes.slice(0, MAX_MIXES);
    const remaining = mixes.length - visible.length;

    const groups = [];
    const seen = {};
    visible.forEach(mix => {
      const month = mix.oldestAddedAt ? monthLabel(mix.oldestAddedAt) : 'Unknown';
      if (!seen[month]) { seen[month] = []; groups.push({ month, items: seen[month] }); }
      seen[month].push(mix);
    });

    let html = '';
    groups.forEach(({ month, items }) => {
      html += `<div style="display:flex;align-items:center;gap:10px;margin:16px 0 12px;">
        <span style="font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:#444;white-space:nowrap;">${month}</span>
        <div style="flex:1;height:1px;background:rgba(255,255,255,0.06);"></div>
      </div>`;
      items.forEach(mix => {
        const dur = mix.totalDurationMs > 0 ? fmtDuration(mix.totalDurationMs) : '—';
        const meta = [`${mix.trackCount} tracks`, dur].filter(Boolean).join(' · ');
        html += renderMixRow(mix.name, meta, mix.image, mix.url);
      });
    });

    if (remaining > 0) {
      html += `<button id="mix-more-btn" style="width:100%;margin-top:12px;padding:10px;background:transparent;border:1px solid rgba(255,255,255,0.12);color:#999;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;">+ ${remaining} More</button>`;
    }

    return html;
  }

  let allMixes = [];

  function renderAndWire(showAll) {
    const container = document.getElementById('mix-list');
    if (!container) return;
    container.innerHTML = renderMixList(allMixes, showAll);
    const moreBtn = document.getElementById('mix-more-btn');
    if (moreBtn) moreBtn.addEventListener('click', () => renderAndWire(true));
  }

  async function loadMixes() {
    const container = document.getElementById('mix-list');
    if (!container) return;

    container.innerHTML = Array(MAX_MIXES).fill(0).map(skeletonRow).join('');

    try {
      const res = await fetch(MIXES_ENDPOINT);
      if (!res.ok) throw new Error(`MIXES_ERROR_${res.status}`);
      const data = await res.json();
      allMixes = data.mixes || [];

      if (allMixes.length === 0) {
        container.innerHTML = `<div style="font-size:11px;color:#555;padding:12px 0;">No mixes found yet.</div>`;
        return;
      }

      renderAndWire(false);
    } catch (err) {
      console.error('Mixes load failed:', err);
      container.innerHTML = `<div style="font-size:11px;color:#555;padding:12px 0;">Could not load mixes.</div>`;
    }
  }

  document.addEventListener('DOMContentLoaded', loadMixes);

  // ─── YouTube Config ──────────────────────────────────────────────────────
  const YT_API_KEY     = 'AIzaSyD0fAm9iOXtdipNQDw0GSF63LW50-Zn7RY';
  const YT_PLAYLIST_ID = 'PLilRFyj4i-3GrbHBLl9Ldeim7CTI5jDEc';
  const MAX_SETS       = 4;
  // ────────────────────────────────────────────────────────────────────────

  function fmtYTDuration(iso) {
    // Parses ISO 8601 duration e.g. PT1H2M14S
    const match = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
    if (!match) return '—';
    const h = parseInt(match[1] || 0);
    const m = parseInt(match[2] || 0);
    const s = parseInt(match[3] || 0);
    const mm = String(m).padStart(2, '0');
    const ss = String(s).padStart(2, '0');
    return h > 0 ? `${h}:${mm}:${ss}` : `${m}:${ss}`;
  }

  async function loadSets() {
    const container = document.getElementById('sets-list');
    if (!container) return;

    // Skeleton
    container.innerHTML = Array(MAX_SETS).fill(0).map(() => `
      <div class="mix-row" style="opacity:0.25;">
        <div class="mix-thumb">▶</div>
        <div class="mix-info">
          <div style="background:rgba(255,255,255,0.1);height:13px;width:200px;border-radius:2px;"></div>
          <div style="background:rgba(255,255,255,0.05);height:9px;width:60px;border-radius:2px;margin-top:6px;"></div>
        </div>
      </div>`).join('');

    try {
      // Step 1: get video IDs from playlist
      const plRes = await fetch(
        `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=${MAX_SETS}&playlistId=${YT_PLAYLIST_ID}&key=${YT_API_KEY}`
      );
      const plData = await plRes.json();

      if (plData.error) {
        console.error('YouTube playlist error:', plData.error);
        container.innerHTML = `<div style="font-size:11px;color:#555;padding:12px 0;">Could not load sets.</div>`;
        return;
      }

      const items = plData.items || [];
      const videoIds = items.map(i => i.snippet.resourceId.videoId).join(',');

      // Step 2: get durations for each video
      const vidRes = await fetch(
        `https://www.googleapis.com/youtube/v3/videos?part=contentDetails&id=${videoIds}&key=${YT_API_KEY}`
      );
      const vidData = await vidRes.json();
      const durations = {};
      (vidData.items || []).forEach(v => {
        durations[v.id] = v.contentDetails.duration;
      });

      container.innerHTML = items.map((item, i) => {
        const title = item.snippet.title;
        const videoId = item.snippet.resourceId.videoId;
        const dur = durations[videoId] ? fmtYTDuration(durations[videoId]) : '—';
        const url = `https://www.youtube.com/watch?v=${videoId}`;
        const num = String(i + 1).padStart(2, '0');
        const thumb = item.snippet.thumbnails?.medium?.url || item.snippet.thumbnails?.default?.url || null;
        const thumbHtml = thumb
          ? `<img src="${thumb}" alt="" style="width:38px;height:38px;object-fit:cover;flex-shrink:0;">`
          : `<div style="width:38px;height:38px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:center;color:#444;font-size:14px;flex-shrink:0;">▶</div>`;
        return `
          <div class="mix-row">
            <div class="mix-thumb">${thumbHtml}</div>
            <div class="mix-info" style="flex:1;min-width:0;">
              <a href="${url}" target="_blank" rel="noopener" style="text-decoration:none;">
                <div class="mix-title" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${title}</div>
              </a>
              <div class="mix-meta">${dur}</div>
            </div>
          </div>`;
      }).join('');

    } catch (err) {
      console.error('YouTube load failed:', err);
      container.innerHTML = `<div style="font-size:11px;color:#555;padding:12px 0;">Could not load sets.</div>`;
    }
  }

  document.addEventListener('DOMContentLoaded', loadSets);

  // ─── Google Calendar Config ──────────────────────────────────────────────
  const GCAL_API_KEY = 'AIzaSyD0fAm9iOXtdipNQDw0GSF63LW50-Zn7RY';
  const GCAL_ID      = '04t6q307tih41nrcj5ue0mrunc@group.calendar.google.com';
  const MAX_EVENTS   = 8;
  // ────────────────────────────────────────────────────────────────────────

  function fmtEventDate(dateStr) {
    const d = new Date(dateStr);
    const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const day = days[d.getDay()];
    const month = months[d.getMonth()];
    const date = d.getDate();
    let hours = d.getHours();
    const ampm = hours >= 12 ? 'pm' : 'am';
    hours = hours % 12 || 12;
    return `${day} · ${month} ${date} · ${hours}${ampm}`;
  }

  function isFirstUpcoming(events, index) {
    return index === 0;
  }

  function renderCalRow(event, isNext) {
    const start = event.start.dateTime || event.start.date;
    const dateStr = fmtEventDate(start);
    const name = event.summary || 'TBA';
    
    // Parse description for venue, detail, and ticket URL
    const desc = event.description || '';
    const lines = desc.split('\n').map(l => l.trim()).filter(Boolean);
    const venue = lines[0] || 'Denver';
    const detail = lines[1] || '';
    const ticketUrl = lines.find(l => l.startsWith('http')) || null;

    const nextBadge = isNext ? `<span class="cal-next">Next up</span>` : '';
    const ticketBtn = ticketUrl
      ? `<a class="cal-tickets" href="${ticketUrl}" target="_blank" rel="noopener">Tickets →</a>`
      : `<span class="cal-tba">TBA</span>`;

    return `
      <div class="cal-row${isNext ? ' next' : ''}">
        ${nextBadge}
        <div class="cal-top">
          <div>
            <div class="cal-date">${dateStr}</div>
            <div class="cal-name">${name}</div>
            <div class="cal-venue">${venue}</div>
            ${detail ? `<div class="cal-detail">${detail}</div>` : ''}
          </div>
          ${ticketBtn}
        </div>
      </div>`;
  }

  async function loadCalendar() {
    const container = document.getElementById('cal-list');
    if (!container) return;

    const now = new Date().toISOString();
    const calId = encodeURIComponent(GCAL_ID);
    const url = `https://www.googleapis.com/calendar/v3/calendars/${calId}/events?key=${GCAL_API_KEY}&timeMin=${now}&maxResults=${MAX_EVENTS}&singleEvents=true&orderBy=startTime`;

    try {
      const res = await fetch(url);
      const data = await res.json();

      if (data.error) {
        console.error('Calendar error:', data.error);
        container.innerHTML = `<div style="font-size:11px;color:#555;padding:12px 0;">Could not load shows.</div>`;
        return;
      }

      const events = data.items || [];
      if (events.length === 0) {
        container.innerHTML = `<div style="font-size:11px;color:#555;padding:12px 0;">No upcoming shows.</div>`;
        return;
      }

      container.innerHTML = events.map((e, i) => renderCalRow(e, i === 0)).join('');

    } catch (err) {
      console.error('Calendar load failed:', err);
      container.innerHTML = `<div style="font-size:11px;color:#555;padding:12px 0;">Could not load shows.</div>`;
    }
  }

  document.addEventListener('DOMContentLoaded', loadCalendar);


</script>

</body></html>
